[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[project]
name = "commodity-risk-system"
version = "0.1.0"
description = "Auditable futures portfolio risk with explicit data provenance"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.3,<3", "pyarrow>=21,<24"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.17,<2", "pandas-stubs>=2.3,<3"]
[project.scripts]
commodity-risk = "commodity_risk.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/commodity_risk"]
[tool.ruff]
line-length = 100
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
[tool.pytest.ini_options]
testpaths = ["tests"]
